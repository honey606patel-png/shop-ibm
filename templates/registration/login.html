
{% extends 'base.html' %}

{% block title %}Login - Shop IBM{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 70vh;">
    <div class="col-md-6 col-lg-4">
        <div class="card shadow border-0 rounded-3">
            <div class="card-body p-4 p-sm-5">
                
                <!-- Branding Header -->
                <div class="text-center mb-4">
                    <div class="bg-primary text-white rounded-circle d-inline-flex align-items-center justify-content-center mb-3" style="width: 56px; height: 56px;">
                        <i class="bi bi-shop fs-3"></i>
                    </div>
                    <h4 class="fw-bold text-dark">Welcome Back</h4>
                    <p class="text-muted small">Sign in to access your Shop IBM dashboard</p>
                </div>

                <!-- Error Alert -->
                {% if form.errors %}
                <div class="alert alert-danger alert-dismissible fade show small py-2" role="alert">
                    <i class="bi bi-exclamation-circle-fill me-1"></i> Invalid username or password.
                    <button type="button" class="btn-close py-2" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
                {% endif %}

                <!-- Login Form -->
                <form method="post">
                    {% csrf_token %}
                    
                    <div class="mb-3">
                        <label for="id_username" class="form-label small fw-bold text-secondary">Username</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light text-muted border-end-0"><i class="bi bi-person"></i></span>
                            <input type="text" name="username" id="id_username" class="form-control border-start-0 ps-1" placeholder="Enter username" required autofocus>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="id_password" class="form-label small fw-bold text-secondary">Password</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light text-muted border-end-0"><i class="bi bi-lock"></i></span>
                            <input type="password" name="password" id="id_password" class="form-control border-start-0 ps-1" placeholder="Enter password" required>
                        </div>
                    </div>

                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary py-2 fw-semibold">
                            Sign In <i class="bi bi-box-arrow-in-right ms-1"></i>
                        </button>
                    </div>
                </form>

            </div>
        </div>
    </div>
</div>
{% endblock %}
